name: Resu-match Ci/Cd
on:
  push:
       branches:
         - main


jobs:
  create-resumatch:
    runs-on: ubuntu-latest
    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: install dependencies
        working-directory: ./
        run: npm install

      - name: build the code
        run: npm build


  docker:
    runs-on: ubuntu-latest
    needs: create-resumatch
    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: log in to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push the image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resumatch:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/resumatch:latest